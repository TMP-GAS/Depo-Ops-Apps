<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<meta name="description" content="D.O.A - Depo Operational Apps">
<title>D.O.A</title>

<!-- ===== PWA: manifest + ikon (Android, Windows/Mac, iPhone) ===== -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="D.O.A">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="D.O.A">

<style>
  html,body{margin:0;height:100%;background:#0B1020;font-family:system-ui,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#fff;z-index:5;
        background:radial-gradient(circle at 50% 35%,#16306b 0%,#0B1020 70%)}
  #gate img{width:132px;height:132px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
  #gate button{font-size:17px;padding:14px 22px;border:0;border-radius:12px;background:#fff;color:#0b5ed7;font-weight:700}
  #gate small{opacity:.9;max-width:340px}
  .hidden{display:none!important}

  /* ===== Banner rekomendasi instal ===== */
  #inst{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;
        max-width:460px;margin:0 auto;background:#fff;color:#0B1020;border-radius:16px;
        box-shadow:0 10px 30px rgba(0,0,0,.35);padding:14px;display:flex;gap:12px;align-items:center;
        animation:up .35s ease-out}
  #inst img{width:52px;height:52px;flex:none;border-radius:12px}
  #inst .t{flex:1;min-width:0;font-size:14px;line-height:1.35}
  #inst .t b{display:block;font-size:15px;margin-bottom:2px}
  #inst .a{display:flex;flex-direction:column;gap:6px}
  #inst button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer}
  #instYes{background:#0b5ed7;color:#fff}
  #instNo{background:transparent;color:#555;font-weight:500!important;font-size:13px!important;padding:4px!important}
  .ios-share{display:inline-block;width:16px;height:16px;vertical-align:-3px}
  @keyframes up{from{transform:translateY(120%);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>

<div id="gate">
  <img src="./icon-512.png" alt="D.O.A">
  <h2 style="margin:0">Depo Operational Apps</h2>
  <small id="gmsg">Aplikasi memerlukan izin <b>Lokasi</b> dan <b>Kamera</b> untuk foto serah terima. Ketuk tombol di bawah, lalu pilih <b>Izinkan</b>.</small>
  <button id="gbtn">Mulai &amp; beri izin</button>
  <button id="gskip" style="background:transparent;color:#fff;font-weight:400;font-size:14px;text-decoration:underline">Lewati dulu</button>
</div>

<!-- allow= wajib: tanpa ini iframe lintas-origin (Google Apps Script) otomatis diblokir dari kamera & lokasi -->
<iframe id="app" class="hidden" title="Depo App"
  allow="camera *; microphone *; geolocation *; fullscreen *; clipboard-write *; autoplay *"
  allowfullscreen></iframe>

<!-- Banner rekomendasi instal (muncul otomatis bila aplikasi belum terpasang) -->
<div id="inst" class="hidden" role="dialog" aria-label="Instal aplikasi">
  <img src="./icon-192.png" alt="">
  <div class="t" id="instTxt"><b>Instal aplikasi D.O.A</b>Pasang di perangkat ini agar bisa dibuka langsung dari layar utama, lebih cepat &amp; layar penuh.</div>
  <div class="a">
    <button id="instYes">Instal</button>
    <button id="instNo">Nanti</button>
  </div>
</div>

<script>
/* ===== GANTI dengan URL Web App (Deploy › Web app › URL berakhiran /exec) ===== */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwjGFeXzFD7dmQUmemjAu5UqzIDoOZhWx4fHmfYIeKUqsZJ2ES07IYJKw3ZZz_En1TlmQ/exec';
/* =============================================================================== */

var frame = document.getElementById('app'), gate = document.getElementById('gate');
function openApp(){ if(!frame.src || frame.src==='about:blank') frame.src = EXEC_URL; frame.classList.remove('hidden'); gate.classList.add('hidden'); }

/* Lokasi paling akurat (berhenti bila ≤20 m atau 12 detik) — dijalankan di halaman induk yang izinnya sudah diberikan */
function bestGeo(){
  return new Promise(function(res, rej){
    if(!navigator.geolocation) return rej(new Error('Perangkat tidak mendukung GPS.'));
    var best=null, done=false, wid=null, tm=null;
    function stop(){ done=true; try{ if(wid!=null) navigator.geolocation.clearWatch(wid) }catch(e){} clearTimeout(tm) }
    function fin(){ if(done) return; stop(); best ? res(best) : rej(new Error('Lokasi tidak tersedia. Aktifkan GPS.')) }
    wid = navigator.geolocation.watchPosition(function(p){
      var c=p.coords; if(!best || c.accuracy<best.acc) best={lat:c.latitude, lng:c.longitude, acc:c.accuracy};
      if(c.accuracy<=20) fin();
    }, function(e){ if(done) return; if(e.code===1){ stop(); rej(new Error('Izin lokasi di PWA ditolak. Buka Info Aplikasi › Izin › Lokasi › Izinkan.')) } },
    {enableHighAccuracy:true, timeout:15000, maximumAge:0});
    tm = setTimeout(fin, 12000);
  });
}

/* Jembatan: web app (di dalam iframe) meminta lokasi / membuka browser lewat postMessage */
window.addEventListener('message', function(e){
  var d = e.data; if(!d || d.depoBridge !== 1 || !e.source) return;
  function reply(o){ o.depoBridge = 2; o.id = d.id; try{ e.source.postMessage(o, '*') }catch(x){} }
  if(d.type === 'geo'){
    bestGeo().then(function(g){ reply({ok:true, lat:g.lat, lng:g.lng, acc:g.acc}) })
             .catch(function(err){ reply({ok:false, error:err.message}) });
  } else if(d.type === 'open'){
    window.open(EXEC_URL, '_blank', 'noopener'); reply({ok:true});
  } else if(d.type === 'install'){
    /* opsional: web app di iframe bisa memanggil banner instal */
    showInstall(true); reply({ok:true});
  }
});

/* Minta izin sekali di awal (butuh ketukan pengguna) — izin tersimpan untuk PWA ini */
async function askPerms(){
  var msg = document.getElementById('gmsg'), bad = [];
  try{ await bestGeo() }catch(e){ bad.push('Lokasi') }
  try{
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      var s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
      s.getTracks().forEach(function(t){ t.stop() });
    }
  }catch(e){ bad.push('Kamera') }
  try{ localStorage.setItem('depoPermAsked','1') }catch(e){}
  if(bad.length){
    msg.innerHTML = '⚠️ Izin <b>'+bad.join(' & ')+'</b> belum diberikan. Buka <b>Pengaturan HP › Aplikasi › (nama PWA) › Izin</b>, izinkan Kamera &amp; Lokasi, lalu buka ulang. Anda tetap bisa melanjutkan; foto memakai kamera bawaan HP bila perlu.';
    document.getElementById('gbtn').textContent = 'Lanjut buka aplikasi';
    document.getElementById('gbtn').onclick = openApp;
  } else openApp();
}
document.getElementById('gbtn').onclick = askPerms;
document.getElementById('gskip').onclick = openApp;

/* Sudah pernah diminta? langsung buka aplikasi */
try{ if(localStorage.getItem('depoPermAsked')==='1') openApp(); }catch(e){}

/* ======================================================================
   INSTAL APLIKASI (HP & Komputer)
   - Android / Chrome / Edge / Samsung Internet (HP & PC): tombol "Instal" memunculkan dialog instal asli.
   - iPhone/iPad (Safari): tampil petunjuk "Bagikan › Tambah ke Layar Utama" (Apple tidak mengizinkan tombol otomatis).
   - Dibuka dari WhatsApp/Instagram/FB (browser dalam aplikasi): diarahkan buka di Chrome/Safari dulu.
   - Sudah terinstal / dibuka dari ikon aplikasi: banner tidak muncul.
   ====================================================================== */
var deferredPrompt = null;
var inst = document.getElementById('inst'), instTxt = document.getElementById('instTxt'),
    instYes = document.getElementById('instYes'), instNo = document.getElementById('instNo');
var ua = navigator.userAgent || '';
var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var isInApp = /FBAN|FBAV|Instagram|Line\/|WhatsApp|MicroMessenger|; wv\)/i.test(ua);
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.matchMedia('(display-mode: minimal-ui)').matches ||
         window.navigator.standalone === true;
}
function snoozed(){ try{ return sessionStorage.getItem('doaInstNo')==='1' }catch(e){ return false } }

function showInstall(force){
  if(isStandalone()) return;
  if(!force && snoozed()) return;
  if(isInApp){
    instTxt.innerHTML = '<b>Buka di browser untuk instal</b>Ketuk menu <b>⋮</b> / <b>…</b> lalu pilih <b>Buka di Chrome</b> (Android) atau <b>Buka di Safari</b> (iPhone).';
    instYes.textContent = 'Salin link';
    instYes.onclick = function(){ try{ navigator.clipboard.writeText(location.href); instYes.textContent='Tersalin ✓' }catch(e){} };
  } else if(deferredPrompt){
    instTxt.innerHTML = '<b>Instal aplikasi D.O.A</b>Pasang di perangkat ini agar bisa dibuka langsung dari layar utama / desktop, lebih cepat &amp; layar penuh.';
    instYes.textContent = 'Instal';
    instYes.classList.remove('hidden');
    instYes.onclick = async function(){
      inst.classList.add('hidden');
      deferredPrompt.prompt();
      try{ await deferredPrompt.userChoice }catch(e){}
      deferredPrompt = null;
    };
  } else if(isIOS){
    instTxt.innerHTML = '<b>Instal aplikasi D.O.A</b>Ketuk tombol <b>Bagikan</b> '+
      '<svg class="ios-share" viewBox="0 0 24 24" fill="none" stroke="#0b5ed7" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5"/><rect x="4" y="11" width="16" height="10" rx="2"/></svg>'+
      ' di Safari, lalu pilih <b>Tambah ke Layar Utama</b>.';
    instYes.classList.add('hidden');
  } else {
    return; /* browser belum siap / tidak mendukung — tunggu event beforeinstallprompt */
  }
  inst.classList.remove('hidden');
}
instNo.onclick = function(){ inst.classList.add('hidden'); try{ sessionStorage.setItem('doaInstNo','1') }catch(e){} };

/* Chrome/Edge/Samsung: tangkap event instal lalu tampilkan banner otomatis */
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  showInstall(false);
});
window.addEventListener('appinstalled', function(){
  deferredPrompt = null; inst.classList.add('hidden');
});
/* iPhone & browser dalam aplikasi: tampilkan petunjuk setelah halaman siap */
window.addEventListener('load', function(){ setTimeout(function(){ if(isIOS || isInApp) showInstall(false) }, 1200); });

/* Daftarkan service worker (wajib agar aplikasi bisa diinstal) */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(err){ console.warn('SW gagal didaftarkan:', err) });
  });
}
</script>
</body>
</html>
